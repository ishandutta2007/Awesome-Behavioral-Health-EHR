<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes waveMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0.4; }
      50% { transform: translateY(-15px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.4; }
    }
    .bg-wave {
      stroke: url(#accentGrad);
      stroke-width: 2;
      fill: none;
      opacity: 0.35;
      stroke-dasharray: 10 15;
      animation: waveMove 12s linear infinite;
    }
    .particle {
      animation: floatParticle 4s ease-in-out infinite;
    }
    .p2 { animation-delay: 1.5s; }
    .p3 { animation-delay: 2.5s; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Dynamic Background Lines & Pulses (Kept in Background) -->
  <g opacity="0.6">
    <path class="bg-wave" d="M -50 280 Q 250 180 550 290 T 1250 220" />
    <path class="bg-wave" d="M -50 310 Q 300 220 600 320 T 1250 250" style="animation-duration: 8s; opacity: 0.2;" />
    
    <!-- Pulse Network Nodes (Background Decorative) -->
    <circle cx="150" cy="80" r="4" fill="#38bdf8" class="particle" />
    <circle cx="1020" cy="100" r="5" fill="#34d399" class="particle p2" />
    <circle cx="1100" cy="280" r="3" fill="#818cf8" class="particle p3" />
    <circle cx="80" cy="300" r="4" fill="#38bdf8" class="particle p2" />

    <!-- ECG/Brainwave Pulse Vector in Right Background -->
    <path d="M 820 220 L 870 220 L 885 170 L 905 270 L 925 190 L 940 235 L 955 210 L 970 220 L 1050 220" 
          fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Subdued Decorative Badges (Side Right, behind text depth) -->
  <g transform="translate(850, 70)" opacity="0.85">
    <rect width="280" height="80" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="20" y="32" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">🧠 Clinical Workflows</text>
    <text x="20" y="58" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13">DSM-5 • Notes • Telehealth</text>
  </g>

  <!-- Main Hero Title & Subtitle in FOREGROUND (Clear & High Contrast) -->
  <g transform="translate(80, 115)">
    <!-- Top Pill Category Badge -->
    <g transform="translate(0, 0)">
      <rect width="280" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="16" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
        HEALTHCARE TECH CURATION
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Behavioral Health EHR
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="122" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400">
      Curated SaaS Products &amp; Open-Source Projects for Mental Health Practice Management
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 150)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="rgba(255,255,255,0.08)" />
      <text x="12" y="18" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">🔒 HIPAA Ready</text>
      
      <!-- Tag 2 -->
      <rect x="142" y="0" width="145" height="28" rx="6" fill="rgba(255,255,255,0.08)" />
      <text x="154" y="18" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">💻 Open-Source EMR</text>

      <!-- Tag 3 -->
      <rect x="299" y="0" width="135" height="28" rx="6" fill="rgba(255,255,255,0.08)" />
      <text x="311" y="18" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">🏥 Practice SaaS</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Border Line -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#accentGrad)" />
</svg>
